# El "checker" de la Semana 2.
# Corre cada vez que se hace push a main tocando runners.yml.
# Lee en qué paso va el asistente (guardado en el título del issue de seguimiento
# "Mi progreso: GitHub Actions Semana 2"), valida el contenido, comenta el
# resultado y avanza al siguiente paso.

name: "Workshop 🚀 - Revisar avance Semana 2"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runners.yml'

permissions:
  contents: read
  issues: write

jobs:
  check_progress:
    name: Revisar la actividad y dar feedback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ubicar el issue de seguimiento y el paso actual
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh issue list \
            --search "\"Mi progreso: GitHub Actions Semana 2\" in:title" \
            --state open \
            --json number,title \
            --jq '.[0]')

          if [ -z "$DATA" ] || [ "$DATA" = "null" ]; then
            echo "⚠️ No se encontró un issue de seguimiento abierto para la Semana 2."
            echo "Corre primero el workflow 'Workshop 🚀 - Iniciar Semana 2' desde la pestaña Actions."
            exit 0
          fi

          NUMBER=$(echo "$DATA" | jq -r '.number')
          TITLE=$(echo "$DATA" | jq -r '.title')
          STEP=$(echo "$TITLE" | grep -oE 'Paso [0-9]+' | grep -oE '[0-9]+' || true)

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "step=$STEP" >> "$GITHUB_OUTPUT"

      # ---------- PASO 1 (Sesión 4): matrix / runners ----------

      - name: Validar Paso 1 (matrix de runners)
        if: steps.issue.outputs.step == '1'
        id: check1
        run: |
          FILE=.github/workflows/runners.yml
          OK=true
          grep -q "strategy:" "$FILE" || OK=false
          grep -q "matrix:" "$FILE" || OK=false
          grep -q "ubuntu-latest" "$FILE" || OK=false
          grep -q "windows-latest" "$FILE" || OK=false
          grep -q "macos-latest" "$FILE" || OK=false
          grep -q "runs-on: \${{ matrix.os }}" "$FILE" || OK=false
          echo "passed=$OK" >> "$GITHUB_OUTPUT"

      - name: Feedback Paso 1 — correcto, desbloquear Paso 2
        if: steps.issue.outputs.step == '1' && steps.check1.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body-file .github/steps/4-step.md
          gh issue edit "$NUMBER" --title "Mi progreso: GitHub Actions Semana 2 · Paso 2"

      - name: Feedback Paso 1 — a revisar
        if: steps.issue.outputs.step == '1' && steps.check1.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body "🔎 Casi. Revisa que \`runners.yml\` tenga \`strategy.matrix\` con los tres sistemas operativos (\`ubuntu-latest\`, \`windows-latest\`, \`macos-latest\`) y que \`runs-on\` use \`\${{ matrix.os }}\`."

      # ---------- PASO 2 (Sesión 5): env + contexts ----------

      - name: Validar Paso 2 (env y contexts)
        if: steps.issue.outputs.step == '2'
        id: check2
        run: |
          FILE=.github/workflows/runners.yml
          OK=true
          grep -q "^env:" "$FILE" || OK=false
          grep -q "github.actor" "$FILE" || OK=false
          grep -qE "github.sha|github.ref" "$FILE" || OK=false
          echo "passed=$OK" >> "$GITHUB_OUTPUT"

      - name: Feedback Paso 2 — correcto, desbloquear Paso 3
        if: steps.issue.outputs.step == '2' && steps.check2.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body-file .github/steps/5-step.md
          gh issue edit "$NUMBER" --title "Mi progreso: GitHub Actions Semana 2 · Paso 3"

      - name: Feedback Paso 2 — a revisar
        if: steps.issue.outputs.step == '2' && steps.check2.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body "🔎 Casi. Revisa que tengas un bloque \`env:\` a nivel workflow y que uses \`\${{ github.actor }}\` junto con \`\${{ github.sha }}\` o \`\${{ github.ref }}\` en algún \`run:\`."

      # ---------- PASO 3 (Sesión 6): secrets ----------

      - name: Validar Paso 3 (secrets)
        if: steps.issue.outputs.step == '3'
        id: check3
        run: |
          FILE=.github/workflows/runners.yml
          OK=true
          grep -qE "secrets\." "$FILE" || OK=false
          echo "passed=$OK" >> "$GITHUB_OUTPUT"

      - name: Feedback Paso 3 — correcto, cerrar la Semana 2
        if: steps.issue.outputs.step == '3' && steps.check3.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body-file .github/steps/x-final-week2.md
          gh issue edit "$NUMBER" --title "Mi progreso: GitHub Actions Semana 2 · Completado 🎉"
          gh issue close "$NUMBER"

      - name: Feedback Paso 3 — a revisar
        if: steps.issue.outputs.step == '3' && steps.check3.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body "🔎 Casi. Revisa que tu último step use \`\${{ secrets.WORKSHOP_SECRET }}\` (o el nombre de secret que hayas elegido) con la sintaxis \`secrets.NOMBRE\`."
